<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f7f5;
      color: #37352f;
    }
    /* Notion 極簡風格 UI */
    .notion-input {
      outline: none;
      border: 1px solid #e1e1e1;
      border-radius: 6px;
      padding: 8px 12px;
      background: #ffffff;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .notion-input:focus {
      border-color: #9a9a9a;
      box-shadow: 0 0 0 2px rgba(154, 154, 154, 0.15);
    }
    .notion-btn {
      background: #37352f;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    .notion-btn:hover { background: #2f2d27; }
    .notion-btn-secondary {
      background: #ffffff;
      color: #37352f;
      border: 1px solid #e1e1e1;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .notion-btn-secondary:hover { background: #f1f1ef; }
    
    /* 3D 翻牌動畫 */
    .flip-card {
      perspective: 1000px;
    }
    .flip-card-inner {
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      backface-visibility: hidden;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <!-- 登入與房間分流區 -->
  <div id="login-section" class="w-full max-w-md bg-white p-8 rounded-xl shadow-sm border border-gray-200 mt-10">
    <h1 class="text-2xl font-semibold mb-2 flex items-center gap-2 text-gray-800">
      <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      雲端心電感應
    </h1>
    <p class="text-sm text-gray-500 mb-6">輸入房號與暱稱，與好友測試默契。</p>
    
    <div class="flex flex-col gap-4">
      <div>
        <label class="block text-sm text-gray-600 mb-1">房間代碼</label>
        <input type="text" id="room-input" class="notion-input w-full" placeholder="例如: 888">
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">玩家暱稱</label>
        <input type="text" id="player-input" class="notion-input w-full" placeholder="你的名字">
      </div>
      <button onclick="joinRoom()" class="notion-btn w-full mt-2">進入房間</button>
    </div>
  </div>

  <!-- 遊戲主畫面 (預設隱藏) -->
  <div id="game-section" class="w-full max-w-5xl hidden flex-col gap-6">
    <!-- 頂部資訊列 -->
    <div class="flex justify-between items-end border-b border-gray-200 pb-4">
      <div>
        <span class="text-xs text-gray-400 uppercase tracking-wider">Room Code</span>
        <h2 id="room-display" class="text-xl font-semibold text-gray-700"></h2>
      </div>
      <div class="text-sm text-gray-500">
        玩家：<span id="player-display" class="font-medium text-gray-800"></span>
      </div>
    </div>

    <!-- 房主專屬控制台 (預設隱藏) -->
    <div id="host-panel" class="hidden bg-gradient-to-r from-gray-100 to-gray-50 p-5 rounded-lg border border-gray-200 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-500 mb-3 flex items-center gap-2">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"></path></svg>
        房主控制台
      </h3>
      
      <!-- 狀態：等待出題 -->
      <div id="host-setup-controls" class="hidden">
        <div class="flex gap-2">
          <input type="text" id="host-question-input" class="notion-input flex-1" placeholder="輸入題目 (例如：最喜歡的顏色？)">
          <button onclick="sendAction('set_question', {question: document.getElementById('host-question-input').value})" class="notion-btn">發布題目</button>
        </div>
      </div>

      <!-- 狀態：遊戲中 -->
      <div id="host-playing-controls" class="hidden flex gap-2">
        <button onclick="sendAction('reveal')" class="notion-btn w-full bg-blue-600 hover:bg-blue-700">全體開牌！</button>
      </div>

      <!-- 狀態：已開牌 -->
      <div id="host-revealed-controls" class="hidden flex gap-2">
        <button onclick="sendAction('reset')" class="notion-btn-secondary w-full">重新開始新一局</button>
      </div>
    </div>

    <!-- 題目展示區 -->
    <div id="question-display-area" class="text-center py-8">
      <p id="question-text" class="text-3xl font-medium text-gray-800"></p>
    </div>

    <!-- 玩家填答區 -->
    <div id="answer-form-container" class="hidden max-w-md mx-auto w-full">
      <div class="flex gap-2">
        <input type="text" id="player-answer-input" class="notion-input flex-1 text-center" placeholder="輸入你的直覺答案...">
        <button onclick="submitAnswer()" class="notion-btn">送出</button>
      </div>
      <p id="submit-status" class="text-xs text-center text-green-600 mt-2 h-4"></p>
    </div>

    <!-- 卡片展示區 -->
    <div id="cards-area" class="flex flex-wrap justify-center gap-6 mt-8">
      <!-- 卡片由 JS 動態生成 -->
    </div>

  </div>

  <!-- 隱藏的房主開關 (右下角極淡的小圓點) -->
  <div class="fixed bottom-3 right-3 w-3 h-3 rounded-full bg-gray-300 opacity-20 hover:opacity-100 cursor-pointer transition-opacity" onclick="toggleHost()" title="切換房主模式"></div>

  <!-- 提示訊息框 (取代原生 alert) -->
  <div id="toast-message" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-sm px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

  <script>
    // 已更新為新的 API 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyAQhuKH4eE4IbwY2Be4fgdHPDFxkVfFCa5qclWnlGEJT1_OGtF6sFdD1xRgfOrfiU/exec";
    
    let currentRoom = "";
    let playerName = "";
    let isHost = false;
    let pollTimer = null;
    let lastStateStr = ""; 
    let toastTimeout = null;

    // 自訂非阻塞式提示訊息
    function showToast(msg) {
      const toast = document.getElementById("toast-message");
      toast.textContent = msg;
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 2500);
    }

    function joinRoom() {
      const rInput = document.getElementById("room-input").value.trim();
      const pInput = document.getElementById("player-input").value.trim();
      
      if (!rInput || !pInput) {
        showToast("請輸入房間代碼與暱稱！");
        return;
      }

      currentRoom = rInput;
      playerName = pInput;

      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("game-section").classList.remove("hidden");
      document.getElementById("game-section").classList.add("flex");
      
      document.getElementById("room-display").textContent = currentRoom;
      document.getElementById("player-display").textContent = playerName;

      // 開始輪詢
      pollData();
      pollTimer = setInterval(pollData, 2000);
    }

    function toggleHost() {
      isHost = !isHost;
      const hostPanel = document.getElementById("host-panel");
      if (isHost) {
        hostPanel.classList.remove("hidden");
        showToast("🔒 房主模式已啟用");
      } else {
        hostPanel.classList.add("hidden");
        showToast("🔒 房主模式已關閉");
      }
      // 強制重新渲染房主控制項
      if (lastStateStr) {
        renderUI(JSON.parse(lastStateStr));
      }
      pollData(); 
    }

    async function pollData() {
      if (!currentRoom) return;
      try {
        // 加入 redirect: 'follow' 處理跨域轉址
        const res = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`, {
          method: 'GET',
          redirect: 'follow'
        });
        const data = await res.json();
        
        const currentStateStr = JSON.stringify(data);
        if (currentStateStr !== lastStateStr) {
          renderUI(data);
          lastStateStr = currentStateStr;
        }
      } catch (err) {
        console.error("Polling error:", err);
      }
    }

    async function sendAction(action, extraData = {}) {
      const payload = {
        room: currentRoom,
        action: action,
        playerName: playerName,
        ...extraData
      };
      
      try {
        // 加入 headers text/plain 與 redirect 處理 POST 的跨域與預檢請求
        await fetch(GAS_API_URL, {
          method: "POST",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });
        pollData(); 
      } catch (err) {
        console.error("Action error:", err);
      }
    }

    function submitAnswer() {
      const ans = document.getElementById("player-answer-input").value.trim();
      if (!ans) return;
      
      sendAction("submit_answer", { answer: ans });
      document.getElementById("submit-status").textContent = "已成功送出答案！可隨時修改。";
    }

    function renderUI(data) {
      const { status, question, answers } = data;
      const qText = document.getElementById("question-text");
      const answerForm = document.getElementById("answer-form-container");
      const cardsArea = document.getElementById("cards-area");

      // 1. 處理狀態文字與輸入框
      if (status === "setup") {
        qText.innerHTML = "<span class='text-gray-400 italic text-xl'>等待房主出題中...</span>";
        answerForm.classList.add("hidden");
        document.getElementById("player-answer-input").value = "";
        document.getElementById("submit-status").textContent = "";
      } else {
        qText.textContent = question;
        if (status === "playing") {
          answerForm.classList.remove("hidden");
        } else if (status === "revealed") {
          answerForm.classList.add("hidden");
        }
      }

      // 2. 處理 3D 卡片渲染
      cardsArea.innerHTML = "";
      if (answers) {
        Object.keys(answers).forEach(name => {
          const ans = answers[name];
          const isFlipped = status === "revealed" ? "flipped" : "";
          
          const cardHTML = `
            <div class="flip-card w-40 h-56 ${isFlipped}">
              <div class="flip-card-inner relative w-full h-full shadow-sm rounded-xl border border-gray-200">
                
                <!-- 卡片背面 (未開牌時顯示) -->
                <div class="flip-card-front bg-gradient-to-br from-gray-50 to-gray-200 rounded-xl flex flex-col items-center justify-center p-4">
                  <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-sm mb-3 text-gray-400 font-bold text-xl">
                    ${name.charAt(0).toUpperCase()}
                  </div>
                  <p class="font-medium text-gray-700 truncate w-full text-center">${name}</p>
                  <span class="text-[10px] mt-2 bg-green-100 text-green-700 px-2 py-0.5 rounded-full border border-green-200">Ready</span>
                </div>
                
                <!-- 卡片正面 (開牌時顯示答案) -->
                <div class="flip-card-back bg-white rounded-xl shadow-md border border-gray-300 flex flex-col items-center justify-center p-4">
                  <p class="font-bold text-gray-800 text-2xl text-center break-words w-full">${ans}</p>
                  <div class="absolute bottom-4 left-0 w-full text-center border-t border-gray-100 pt-2">
                    <p class="text-xs text-gray-400">${name}</p>
                  </div>
                </div>

              </div>
            </div>
          `;
          cardsArea.insertAdjacentHTML('beforeend', cardHTML);
        });
      }

      // 3. 處理房主面板顯示邏輯
      if (isHost) {
        document.getElementById("host-setup-controls").style.display = status === "setup" ? "block" : "none";
        document.getElementById("host-playing-controls").style.display = status === "playing" ? "flex" : "none";
        document.getElementById("host-revealed-controls").style.display = status === "revealed" ? "flex" : "none";
        
        if (status === "setup") {
          document.getElementById("host-question-input").value = "";
        }
      }
    }
  </script>
</body>
</html>
