<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龐克風晚餐隨機抽籤機</title>
    
    <!-- 1. 規範 head 標籤設定與外部 stylesheet 連結 -->
    <link rel="stylesheet" href="style.css">

    <!-- 2. 引入 Google Fonts (龐克字體 Permanent Marker + 繁體中文 Noto Sans TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Permanent+Marker&display=swap" rel="stylesheet">

    <!-- 3. 引入 html2canvas CDN (實作截圖下載功能) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- 4. 規範 script 載入設定 -->
    <script src="script.js" defer></script>

    <!-- 內嵌 CSS 樣式 (確保單一檔案可直接運作) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Noto Sans TC', 'Permanent Marker', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(#1f1f2e 15%, transparent 16%), radial-gradient(#1a001a 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* 龐克外框卡片 */
        .punk-card {
            background: #121212;
            border: 5px solid #00ffff;
            box-shadow: 10px 10px 0px #ff0055, -6px -6px 0px #39ff14;
            padding: 35px 25px;
            border-radius: 4px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            position: relative;
        }

        /* 龐克標籤裝飾 */
        .punk-card::before {
            content: "PUNK PICKER";
            position: absolute;
            top: -15px;
            left: 15px;
            background: #ff0055;
            color: #000;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 2px 8px;
            transform: rotate(-3deg);
            border: 2px solid #000;
        }

        /* 畫面中間大標題 */
        .title {
            font-size: 2.3rem;
            font-weight: 900;
            color: #ffe600;
            text-shadow: 3px 3px 0px #ff0055, -2px -2px 0px #000;
            margin-bottom: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
        }

        /* 生動彈跳動畫 */
        .bounce-animation {
            animation: punkBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes punkBounce {
            0% {
                transform: scale(0.2) rotate(-15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.25) rotate(8deg);
                color: #39ff14;
                opacity: 1;
            }
            75% {
                transform: scale(0.9) rotate(-4deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* 照片顯示區塊 */
        .image-container {
            margin: 15px 0 25px 0;
            border: 4px solid #ff0055;
            box-shadow: 6px 6px 0px #00ffff;
            background-color: #000;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        /* 按鈕群組 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .punk-btn {
            display: block;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 14px 20px;
            cursor: pointer;
            text-transform: uppercase;
            border: 3px solid #000;
            transition: all 0.1s ease;
            letter-spacing: 1px;
        }

        /* 點我抽籤按鈕 */
        .draw-btn {
            background-color: #ff0055;
            color: #ffffff;
            box-shadow: 5px 5px 0px #39ff14;
        }

        .draw-btn:hover {
            background-color: #39ff14;
            color: #000000;
            box-shadow: 5px 5px 0px #ff0055;
            transform: translate(-2px, -2px);
        }

        .draw-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px;
        }

        /* Google Maps 按鈕 */
        .maps-btn {
            background-color: #00ffff;
            color: #000000;
            box-shadow: 5px 5px 0px #ffe600;
        }

        .maps-btn:hover {
            background-color: #ffe600;
            color: #000000;
            box-shadow: 5px 5px 0px #00ffff;
            transform: translate(-2px, -2px);
        }

        /* 截圖下載按鈕 */
        .capture-btn {
            background-color: #ffe600;
            color: #000000;
            box-shadow: 5px 5px 0px #ff0055;
        }

        .capture-btn:hover {
            background-color: #ff0055;
            color: #ffffff;
            box-shadow: 5px 5px 0px #00ffff;
            transform: translate(-2px, -2px);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 主卡片區塊 -->
    <div id="capture-area" class="punk-card">
        <!-- 畫面中間大標題 -->
        <h1 id="dinner-title" class="title">晚餐吃甚麼</h1>

        <!-- 顯示照片區塊 -->
        <div id="image-container" class="image-container hidden">
            <img id="food-image" src="" alt="美食照片">
        </div>

        <!-- 按鈕操作區 -->
        <div class="button-group">
            <button id="draw-btn" class="punk-btn draw-btn">點我抽籤</button>
            <a id="maps-btn" href="#" target="_blank" class="punk-btn maps-btn hidden">馬上出發 (Google Maps)</a>
            <button id="capture-btn" class="punk-btn capture-btn hidden">📷 下載結果截圖</button>
        </div>
    </div>

    <!-- 內嵌 JavaScript 邏輯 -->
    <script>
        // JS 邏輯完全包裝在 DOMContentLoaded 中，避免 null 錯誤
        document.addEventListener('DOMContentLoaded', () => {
            const options = [
                {
                    name: "深水食堂",
                    image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80",
                    query: "深水食堂"
                },
                {
                    name: "鴨肉飯",
                    image: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=600&q=80",
                    query: "鴨肉飯"
                },
                {
                    name: "咖啡休閒",
                    image: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=600&q=80",
                    query: "咖啡館"
                },
                {
                    name: "便當",
                    image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80",
                    query: "便當店"
                },
                {
                    name: "火鍋",
                    image: "https://images.unsplash.com/photo-1555126634-323283e090fa?auto=format&fit=crop&w=600&q=80",
                    query: "火鍋店"
                }
            ];

            const title = document.getElementById('dinner-title');
            const drawBtn = document.getElementById('draw-btn');
            const mapsBtn = document.getElementById('maps-btn');
            const captureBtn = document.getElementById('capture-btn');
            const imageContainer = document.getElementById('image-container');
            const foodImage = document.getElementById('food-image');
            const captureArea = document.getElementById('capture-area');

            // 抽籤按鈕事件
            drawBtn.addEventListener('click', () => {
                const randomIndex = Math.floor(Math.random() * options.length);
                const selected = options[randomIndex];

                // 重置動畫
                title.classList.remove('bounce-animation');
                void title.offsetWidth;

                // 替換標題與觸發彈跳動畫
                title.textContent = selected.name;
                title.classList.add('bounce-animation');

                // 顯示照片
                foodImage.src = selected.image;
                imageContainer.classList.remove('hidden');

                // 設定 Google Maps 導航連結
                mapsBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selected.query)}`;
                mapsBtn.classList.remove('hidden');

                // 顯示截圖下載按鈕
                captureBtn.classList.remove('hidden');
            });

            // html2canvas 截圖下載功能
            captureBtn.addEventListener('click', () => {
                html2canvas(captureArea, { useCORS: true }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `dinner-choice-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            });
        });
    </script>
</body>
</html>
