
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐吃甚麼？ - 龐克抽籤機</title>
    
    <!-- CSS 樣式區塊 -->
    <style>
        /* 全局樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Impact, sans-serif;
        }

        body {
            background-color: #0f0f14;
            background-image: radial-gradient(#1f1f2e 15%, transparent 16%);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 主卡片容器 */
        .card {
            background: #181824;
            border: 4px solid #ff0055;
            box-shadow: 8px 8px 0px #00ffcc;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        /* 標題樣式 */
        .title {
            color: #ffe600;
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 3px 3px 0px #ff0055;
            letter-spacing: 2px;
            word-break: break-all;
        }

        /* 圖片容器 */
        .image-container {
            width: 100%;
            height: 220px;
            border: 3px solid #00ffcc;
            box-shadow: 4px 4px 0px #ff0055;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            background-color: #000;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        /* 按鈕組 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 龐克通用按鈕 */
        .punk-btn {
            display: inline-block;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 20px;
            border: 3px solid #000;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        /* 主按鈕（點我抽籤） */
        .punk-btn.primary {
            background: #ff0055;
            color: #fff;
            box-shadow: 5px 5px 0px #ffe600;
        }

        .punk-btn.primary:hover {
            background: #ff3377;
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #ffe600;
        }

        .punk-btn.primary:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px #ffe600;
        }

        /* 次要按鈕（馬上出發） */
        .punk-btn.secondary {
            background: #00ffcc;
            color: #000;
            box-shadow: 5px 5px 0px #ff0055;
        }

        .punk-btn.secondary:hover {
            background: #33ffd5;
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #ff0055;
        }

        .punk-btn.secondary:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px #ff0055;
        }

        /* 生動彈跳動畫類別 */
        .bounce-animation {
            animation: bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 主標題區塊 -->
        <h1 id="main-title" class="title">晚餐吃甚麼</h1>
        
        <!-- 圖片顯示區 -->
        <div class="image-container">
            <img id="food-img" src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&auto=format&fit=crop" alt="食物圖片">
        </div>

        <!-- 按鈕區塊 -->
        <div class="btn-group">
            <button id="draw-btn" class="punk-btn primary">點我抽籤</button>
            <a id="maps-link" class="punk-btn secondary" href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">馬上出發</a>
        </div>
    </div>

    <!-- JavaScript 邏輯區塊 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 定義選項資料（包含名稱、示意圖片網址、Google Maps 搜尋連結）
            const foodOptions = [
                {
                    name: "深水食堂",
                    image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=600&auto=format&fit=crop",
                    mapsUrl: "https://www.google.com/maps/search/深水食堂"
                },
                {
                    name: "鴨肉飯",
                    image: "https://images.unsplash.com/photo-1544025162-d76694265947?w=600&auto=format&fit=crop",
                    mapsUrl: "https://www.google.com/maps/search/鴨肉飯"
                },
                {
                    name: "咖啡休閒",
                    image: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=600&auto=format&fit=crop",
                    mapsUrl: "https://www.google.com/maps/search/咖啡廳"
                },
                {
                    name: "便當",
                    image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop",
                    mapsUrl: "https://www.google.com/maps/search/便當"
                },
                {
                    name: "火鍋",
                    image: "https://images.unsplash.com/photo-1555126634-323283e090fa?w=600&auto=format&fit=crop",
                    mapsUrl: "https://www.google.com/maps/search/火鍋"
                }
            ];

            // 2. 取得 HTML 元素
            const mainTitle = document.getElementById('main-title');
            const drawBtn = document.getElementById('draw-btn');
            const foodImg = document.getElementById('food-img');
            const mapsLink = document.getElementById('maps-link');

            // 3. 綁定按鈕點擊事件
            drawBtn.addEventListener('click', () => {
                // 隨機抽取一個選項
                const randomIndex = Math.floor(Math.random() * foodOptions.length);
                const selectedFood = foodOptions[randomIndex];

                // 更新標題內容、圖片與地圖連結
                mainTitle.textContent = selectedFood.name;
                foodImg.src = selectedFood.image;
                mapsLink.href = selectedFood.mapsUrl;

                // 觸發彈跳動畫（先移除 class，再重新新增）
                mainTitle.classList.remove('bounce-animation');
                
                // 觸發瀏覽器重繪 (reflow)，確保動畫能重複播放
                void mainTitle.offsetWidth; 
                
                mainTitle.classList.add('bounce-animation');
            });
        });
    </script>
</body>
</html>
