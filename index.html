<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO // 暗黑質感作品集</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        matte: {
                            bg: '#0d0f12',
                            card: 'rgba(20, 24, 31, 0.65)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderHover: 'rgba(255, 255, 255, 0.22)',
                            accent: '#38bdf8', // Sky blue subtle accent
                            emerald: '#10b981', // Unlocked status
                            amber: '#f59e0b',
                            textMuted: '#8b949e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Matte Dark Styling */
        body {
            background-color: #0c0e12;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.02) 0%, transparent 50%);
            background-attachment: fixed;
            color: #f1f5f9;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }

        /* Subtle Noise Overlay for Texture */
        .noise-bg {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.025'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Frosted Glass Matte Card */
        .matte-glass {
            background: rgba(18, 22, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 
                0 10px 30px -10px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        /* Hover Micro-Interactions for Unlocked Cards */
        .unlocked-card {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .unlocked-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .unlocked-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.35);
            box-shadow: 
                0 20px 40px -15px rgba(0, 0, 0, 0.7),
                0 0 20px 0 rgba(56, 189, 248, 0.12),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
        }
        .unlocked-card:hover::before {
            opacity: 1;
        }

        /* Locked Card Styling & Shake Effect */
        .locked-card {
            background: rgba(15, 18, 23, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }
        .locked-card:hover {
            border-color: rgba(239, 68, 68, 0.2);
            background: rgba(20, 22, 28, 0.5);
        }

        .shake-event {
            animation: subtleShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes subtleShake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0e12;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e242c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2e3642;
        }
    </style>
</head>
